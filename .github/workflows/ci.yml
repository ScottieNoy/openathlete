name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, deployment/companion]
  pull_request:
    branches: [main, deployment/companion]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm -r --parallel --no-bail --aggregate-output lint

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm -r --parallel --no-bail --aggregate-output tsc:check

  test:
    name: Test (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Date bucketing must not depend on the runtime timezone
        tz: [UTC, America/New_York, Asia/Tokyo]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm -r --no-bail --aggregate-output test

  integration:
    # API tests against a real, freshly migrated PostgreSQL database
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: oa
          POSTGRES_PASSWORD: oa
          POSTGRES_DB: oa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oa -d oa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://oa:oa@localhost:5432/oa?schema=public
      INTEGRATION_DATABASE_URL: postgresql://oa:oa@localhost:5432/oa?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm database run db:deploy
      - run: pnpm api test:integration

  docs:
    # apps/docs is a standalone pnpm project with its own lockfile
    name: Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: apps/docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm types:check
      - run: pnpm build

  e2e:
    # The production images (same Dockerfiles as releases) with PostgreSQL,
    # Redis and the worker, tested through the API and a real browser
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: openathlete-api:e2e
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: openathlete-web:e2e
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Start the stack
        run: docker compose -f e2e/docker-compose.yml up -d --no-build --wait

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --filter @openathlete/e2e...
      - run: pnpm e2e exec playwright install --with-deps chromium

      - run: pnpm e2e test:e2e

      - name: Service logs
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --no-color api worker web

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, website]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm ${{ matrix.app }} build
      - name: Test AI agents against a fake OpenAI API
        if: matrix.app == 'api'
        run: pnpm api test:agents

  required:
    name: Required checks
    if: always()
    needs: [lint, type-check, test, integration, docs, e2e, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  publish:
    name: Publish checked ${{ matrix.image }} image
    needs: required
    if: github.repository == 'ScottieNoy/openathlete' && github.event_name == 'push' && github.ref == 'refs/heads/deployment/companion'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set image reference
        env:
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.image }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/openathlete-${COMPONENT}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=e2e-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=e2e-${{ matrix.image }}
      - name: Record immutable deployment reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          COMPONENT: ${{ matrix.image }}
          REVISION: ${{ github.sha }}
        run: |
          jq -n --arg source "$REVISION" --arg image "$IMAGE@$DIGEST" \
            '{source: $source, image: $image}' > "$RUNNER_TEMP/image-$COMPONENT.json"
          printf '%s\n' "### $COMPONENT" "Source: \`$REVISION\`" "Image: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: deployment-image-${{ matrix.image }}
          path: ${{ runner.temp }}/image-${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 90
